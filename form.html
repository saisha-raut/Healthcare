<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="form.css">
</head>

<body>

<header>
    <h1>Patient Registration</h1>
    <p>Book Your Laboratory Test</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="tests.html">Tests</a>
    <a href="details.html">Details</a>
    <a href="doctors.html">Doctors</a>
    <a href="table.html">Prices</a>
    <a href="registration.html">Register</a>
    <a href="reports.html">Reports</a>
    <a href="health.html">Health Info</a>
    <a href="media.html">Media</a>
</nav>

<form>

    <fieldset>

        <legend>Patient Details</legend>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name"
               required autofocus>

        <label>Age</label>
        <input type="number" placeholder="Enter your age" required>

        <label>Gender</label>
        <select required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Mobile Number</label>
        <input type="tel" placeholder="Enter mobile number"
               pattern="[0-9]{10}" required>

        <label>Email</label>
        <input type="email" placeholder="Enter email">

        <label>Date of Birth</label>
        <input type="date">

        <label>Select Test</label>
        <select required>
            <option value="">Select Test</option>
            <option>CBC Test</option>
            <option>Urine Test</option>
            <option>Thyroid Profile</option>
            <option>Lipid Profile</option>
            <option>Liver Function Test</option>
            <option>Kidney Function Test</option>
        </select>

        <label>Appointment Date</label>
        <input type="date" required>

        <label>Sample Collection</label>
        <select>
            <option>Visit Laboratory</option>
            <option>Home Collection</option>
        </select>

        <label>Address</label>
        <textarea placeholder="Enter your address"></textarea>

        <label>Upload Prescription</label>
        <input type="file">

        <button type="submit">Register</button>

    </fieldset>

</form>

<footer>
    <p>© 2026 CarePlus Clinical Laboratory</p>
</footer>

</body>
</html>
