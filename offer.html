<!DOCTYPE html>
<html>
<head>
    <title>Special Offers</title>

    <style>

        body {
            background: #F2FAF9;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .offer {
            width: 65%;
            margin: 80px auto;
            padding: 35px;
            background: linear-gradient(to right, #073B4C, #118AB2);
            color: white;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(17,138,178,0.6);
            animation: glow 1.5s infinite alternate;
        }

        .offer h1 {
            font-size: 35px;
            text-shadow: 2px 2px 5px black;
        }

        .offer p {
            font-size: 22px;
        }

        @keyframes glow {

            from {
                transform: scale(1);
                box-shadow: 0 0 15px rgba(17,138,178,0.5);
            }

            to {
                transform: scale(1.03);
                box-shadow: 0 0 35px rgba(7,59,76,0.8);
            }
        }

    </style>
</head>

<body>

<div class="offer">

    <h1>20% OFF ON FULL BODY CHECKUP</h1>

    <p>Free Home Sample Collection</p>

    <p>Accurate Diagnostics & Fast Reports</p>

    <p>CarePlus Clinical Laboratory</p>

    <p>Khar, Mumbai | +91 77989 38342</p>

</div>

</body>
</html>
